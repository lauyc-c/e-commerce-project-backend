name: Deploy to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

# Set up JDK 21
      - name: Set up JDK 21
        uses: actions/setup-java@v5.2.0
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

# Assemble the project with Gradle Wrapper to jar file
      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build with Gradle
        run: ./gradlew build

# Login to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{secrets.DOCKERHUB_USERNAME}}
          password: ${{secrets.DOCKERHUB_PASSWORD}}

# Build and Push Docker image
      - name: Build and Push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{secrets.DOCKERHUB_USERNAME}}/project-backend:latest

# SSH into EC2 instance and Docker Pull, Stop, Remove and Run
      - name: SSH into EC2 instance
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{secrets.EC2_HOST}}
          username: ${{secrets.EC2_USERNAME}}
          key: ${{secrets.EC2_PRIVATE_KEY}}
          port: ${{secrets.EC2_SSH_PORT}}
          script: |
            # Pull the latest image
            sudo docker pull ${{ secrets.DOCKERHUB_USERNAME }}/project-backend:latest

            # Stop and remove the old container if it exists
            sudo docker stop my-app-container || true
            sudo docker rm my-app-container || true
            
            # Run the new container
            sudo docker run -d --name project-backend -p 8080:8080 ${{ secrets.DOCKERHUB_USERNAME }}/project-backend:latest
      
